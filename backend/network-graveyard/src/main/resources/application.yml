spring:
  datasource:
    url: jdbc:mysql://localhost:3306/backend_study?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456 # 替换为你的 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password:  # 如果 Redis 有密码，填入
    database: 0
    timeout: 5000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.neu.domain
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
file:
  upload-dir: D:/Web-design/backend/uploads